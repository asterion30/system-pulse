name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch_name: linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-musl
            arch_name: linux-aarch64
            use_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (for x86_64)
        if: ${{ !matrix.use_cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for aarch64 cross-compilation)
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries (Native x86_64)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --target ${{ matrix.target }} --bins

      - name: Build release binaries (Cross aarch64)
        if: ${{ matrix.use_cross }}
        run: |
          cross build --release --target ${{ matrix.target }} --bins

      - name: Package Artifacts
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PKG_NAME="system-pulse-${VERSION}-${{ matrix.arch_name }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/system-pulse" "dist/${PKG_NAME}/"
          cp "target/${{ matrix.target }}/release/system-cli-pulse" "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          
          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch_name }}
          path: dist/*.tar.gz*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          rm -f *.sha256
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          name: "SystemPulse ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ SystemPulse ${{ github.ref_name }} (Linux Web & CLI)

            Binarios estáticos compilados en entorno limpio con `musl` y optimizaciones de seguridad (hardening).

            ### 📦 Paquetes Disponibles:
            * **Linux x86_64** (Intel / AMD): `system-pulse-${{ github.ref_name }}-linux-x86_64.tar.gz`
            * **Linux ARM64** (Raspberry Pi 4/5, DietPi, Apple Silicon VM): `system-pulse-${{ github.ref_name }}-linux-aarch64.tar.gz`

            ### 🔐 Verificación de Integridad:
            Descarga `SHA256SUMS.txt` y verifica los archivos con:
            ```bash
            sha256sum --check SHA256SUMS.txt
            ```

            ### 🚀 Instalación Rápida:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/asterion30/system-pulse/main/install.sh | bash
            ```
